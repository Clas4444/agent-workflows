name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure and synchronization
        run: python scripts/validate.py
      - name: Verify grouped catalog coverage and rendering
        run: python scripts/catalog.py
      - name: Verify curated cross-group routing review
        run: python scripts/routing_check.py
      - name: Verify skill shortcuts, bundle lookup and UI metadata
        run: python scripts/discovery.py
      - name: Verify role guidance and editable workflow image
        run: python scripts/workflows.py
      - name: Verify every bundle iteration diagram and selection guide
        run: python scripts/bundle_workflows.py
      - name: Validate need-based installation bundles
        run: python scripts/install_skills.py --list
      - name: Diagnose managed canonical payloads without host activation
        run: python scripts/doctor_skills.py --all --target .github/skills
      - name: Verify complete installed resource payloads
        run: python scripts/skill_resources.py
      - name: Verify declared published evidence byte indexes
        run: python scripts/evidence_indexes.py
      - name: Check separated metadata and integrity profile
        run: python -m scripts.validate --profile format
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Verify bundled source runners
        run: python scripts/sync_skills.py --target .github/skills --check
      - name: Check runtime harness interface without invoking models
        run: python scripts/runtime_smoke.py --help
      - name: Compile all source and tests
        run: python -m compileall -q scripts tests
