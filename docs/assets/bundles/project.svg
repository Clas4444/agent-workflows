<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">A software idea into verified slices — project bundle iteration</title>
<desc id="desc">A small software project needs an MVP boundary, acceptance backlog and incremental delivery. One independently checked slice at a time exposes unresolved product choices before scope grows. Revise only while useful, authorized and within budget. Stop with evidence and a checkpoint.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#126957" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="1040" rx="20" fill="#f2f6f4"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#16313b">
<text x="40" y="38" font-size="15" fill="#126957" font-weight="700">LOOP / PROJECT BUNDLE</text>
<text x="40" y="89" font-size="36" fill="#16313b" font-weight="700">A software idea into verified slices</text>
<text x="40" y="137" font-size="15" fill="#126957" font-weight="700">CHOOSE WHEN</text>
<text x="196" y="137" font-size="19" fill="#415d67">A small software project needs an MVP boundary, acceptance backlog and incremental delivery.</text>
<text x="40" y="210" font-size="15" fill="#126957" font-weight="700">WHY THIS LOOP</text>
<text x="196" y="210" font-size="19" fill="#415d67">One independently checked slice at a time exposes unresolved product choices before scope grows.</text>
<rect x="40" y="270" width="328" height="220" rx="12" fill="#fff" stroke="#ceddd8"/>
<text x="58" y="298" font-size="13" fill="#126957" font-weight="700">01 / ONE USEFUL STEP</text>
<text x="58" y="332" font-size="22" fill="#16313b" font-weight="700">Define the MVP</text>
<text x="58" y="393" font-size="18" fill="#415d67">Separate agreed outcomes,</text>
<text x="58" y="417" font-size="18" fill="#415d67">non-goals and open decisions.</text>
<text x="58" y="465" font-size="14" fill="#126957" font-family="Consolas, monospace">loop-workflow-project</text>
<path d="M370 374 H378" fill="none" stroke="#126957" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="384" y="270" width="328" height="220" rx="12" fill="#fff" stroke="#ceddd8"/>
<text x="402" y="298" font-size="13" fill="#126957" font-weight="700">02 / ONE USEFUL STEP</text>
<text x="402" y="332" font-size="22" fill="#16313b" font-weight="700">Plan a ready slice</text>
<text x="402" y="393" font-size="18" fill="#415d67">Order acceptance criteria and</text>
<text x="402" y="417" font-size="18" fill="#415d67">dependencies for one slice.</text>
<text x="402" y="465" font-size="14" fill="#126957" font-family="Consolas, monospace">loop-plan</text>
<path d="M714 374 H722" fill="none" stroke="#126957" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="728" y="270" width="328" height="220" rx="12" fill="#fff" stroke="#ceddd8"/>
<text x="746" y="298" font-size="13" fill="#126957" font-weight="700">03 / ONE USEFUL STEP</text>
<text x="746" y="332" font-size="22" fill="#16313b" font-weight="700">Build if authorized</text>
<text x="746" y="393" font-size="18" fill="#415d67">Implement the agreed slice;</text>
<text x="746" y="417" font-size="18" fill="#415d67">plan-only requests stop earlier.</text>
<text x="746" y="465" font-size="14" fill="#126957" font-family="Consolas, monospace">loop-code</text>
<path d="M1058 374 H1066" fill="none" stroke="#126957" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1072" y="270" width="328" height="220" rx="12" fill="#fff" stroke="#ceddd8"/>
<text x="1090" y="298" font-size="13" fill="#126957" font-weight="700">04 / ONE USEFUL STEP</text>
<text x="1090" y="332" font-size="22" fill="#16313b" font-weight="700">Verify and checkpoint</text>
<text x="1090" y="393" font-size="18" fill="#415d67">Check acceptance and leave a</text>
<text x="1090" y="417" font-size="18" fill="#415d67">source-backed next action.</text>
<text x="1090" y="465" font-size="14" fill="#126957" font-family="Consolas, monospace">loop-test, loop-handoff</text>
<text x="384" y="526" font-size="18" fill="#126957" font-weight="700">Needs revision? Repeat only with time, authority and a useful next step.</text>
<path d="M1220 491 V548 H204 V496" fill="none" stroke="#126957" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1370 491 V566" fill="none" stroke="#126957" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1290" y="561" font-size="14" fill="#126957" font-weight="700">EXIT</text>
<rect x="40" y="574" width="1360" height="58" rx="10" fill="#e0eee7"/>
<text x="60" y="610" font-size="20" fill="#16313b" font-weight="700">STOP: criteria met, blocker, budget, safety boundary or repeated unchanged results. Leave evidence + next action.</text>
<rect x="40" y="656" width="670" height="178" rx="12" fill="#fff" stroke="#d4dfda"/>
<text x="60" y="689" font-size="15" fill="#126957" font-weight="700">RECOMMENDED</text>
<text x="60" y="726" font-size="18" fill="#415d67">• Keep missing roles, budget and product decisions explicit.</text>
<text x="60" y="777" font-size="18" fill="#415d67">• Finish one usable slice before expanding the backlog.</text>
<rect x="730" y="656" width="670" height="178" rx="12" fill="#fff8f4" stroke="#d4dfda"/>
<text x="750" y="689" font-size="15" fill="#8b3c36" font-weight="700">AVOID</text>
<text x="750" y="726" font-size="18" fill="#415d67">• Treat a scaffold as a completed product.</text>
<text x="750" y="777" font-size="18" fill="#415d67">• Infer implementation, paid services or deployment from a plan.</text>
<text x="40" y="875" font-size="17" fill="#415d67">CHOOSE ANOTHER ROUTE: For one code change choose developer; for a non-software assignment choose work or office.</text>
<text x="40" y="944" font-size="15" fill="#126957" font-weight="700">INSTALLED TOOLKIT — choose only needed members; these steps are guidance, not mandatory calls.</text>
<text x="40" y="975" font-size="15" fill="#415d67" font-family="Consolas, monospace">loop, loop-workflow-project, loop-plan, loop-code, loop-test, loop-handoff</text>
<text x="40" y="1020" font-size="16" fill="#415d67">Instructions do not supply service tools or permissions. A passing plan or draft does not prove an external action.</text>
</g>
</svg>
